name: Build firmware

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: "Optional PlatformIO environment (leave blank for the five defaults)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  select-environments:
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.select.outputs.environments }}
    steps:
      - id: select
        env:
          REQUESTED_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          python - <<'PYTHON'
          import json, os
          defaults = [
              "heltec_v4_tft_companion_radio_usb_tcp_touch",
              "LilyGo_TDeck_companion_radio_touch",
              "LilyGo_TDeck_Pro_v1_0_companion_radio_touch",
              "LilyGo_TDeck_Pro_v1_1_companion_radio_touch",
              "ThinkNode_M9_companion_radio_touch",
          ]
          requested = os.environ.get("REQUESTED_ENVIRONMENT", "").strip()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("environments=" + json.dumps([requested] if requested else defaults), file=output)
          PYTHON
  build:
    name: Build ${{ matrix.environment }}
    runs-on: ubuntu-latest
    needs: select-environments
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.select-environments.outputs.environments) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install 'platformio==6.1.18'
      - name: Build application and merged flash image
        env:
          PIO_ENVIRONMENT: ${{ matrix.environment }}
        run: |
          pio run -e "$PIO_ENVIRONMENT" -t mergebin
          test -s ".pio/build/$PIO_ENVIRONMENT/firmware.bin"
          test -s ".pio/build/$PIO_ENVIRONMENT/firmware-merged.bin"
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.environment }}
          path: |
            .pio/build/${{ matrix.environment }}/firmware.bin
            .pio/build/${{ matrix.environment }}/firmware-merged.bin
          if-no-files-found: error
